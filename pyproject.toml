[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
exclude = ["ml/configs/*.json"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"app/docs_page.py" = ["E501"]
"app/main.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
